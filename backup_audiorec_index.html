// セレクトは、選んだあとにフォーカスを外す(残ったままだと、数字キーなどがセレクト側に取られるため)
document.querySelectorAll('select').forEach(sel => sel.addEventListener('change', () => sel.blur()));

// --- キーとモードの対応 ---
const MODE_KEYS = { Digit1: 'shape', Digit2: 'ascii', Digit3: 'puzzle', Digit4: 'emoji',
                    Numpad1: 'shape', Numpad2: 'ascii', Numpad3: 'puzzle', Numpad4: 'emoji' };

// 文字を打つ欄(テキスト入力など)にフォーカスがあるか?  あるときはショートカットを無効にする
// スライダー・スイッチ・ボタンなどは「文字を打つ欄」ではないので、操作直後でもSpaceが効く
function isTyping(el) {
  if (!el) return false;
  if (el.isContentEditable || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') return true;
  if (el.tagName === 'INPUT') return !['range', 'checkbox', 'radio', 'button', 'file', 'color'].includes(el.type);
  return false;
}

window.addEventListener('keydown', (e) => {
  // Ctrl+Z / Cmd+Z: アンドゥ(Shift付きのやり直しは対象外)。入力欄での文字のアンドゥは邪魔しない
  if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && e.code === 'KeyZ') {
    if (!isTyping(document.activeElement)) { e.preventDefault(); undoShuffle(); }
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;       // Ctrl+R(再読み込み)など、ブラウザ自身のショートカットは邪魔しない
  if (isTyping(document.activeElement)) return;         // 入力欄・セレクト操作中は無効(誤動作防止)

  if (e.code === 'Space') {
    if (e.target === video) return;                     // 動画自身にフォーカスがあるときは、動画の標準操作に任せる(二重に切り替わるのを防ぐ)
    e.preventDefault();                                 // 画面スクロールや、フォーカス中ボタンの反応を止める
    if (!e.repeat) togglePlay();                        // 押しっぱなしで連続切り替えしない
    return;
  }
  if (e.repeat) return;
  if (MODE_KEYS[e.code]) setDrawMode(MODE_KEYS[e.code]);
  else if (e.code === 'KeyR') toggleRecording();
  else if (e.code === 'KeyV') toggleSource();
  else if (e.code === 'KeyS') shuffleParameters();      // S: シャッフル
  else if (e.code === 'KeyZ') undoShuffle();            // Z: 1つ前のシャッフルに戻す
});

// Firefoxなどは、Spaceを「離した」ときにボタンを押した扱いにするので、こちらも止める
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space' && e.target !== video && !isTyping(document.activeElement)) e.preventDefault();
});

// ===== シャッフル: 「気持ちよく壊れる範囲」でランダムに組み替える =====
const rand = (a, b) => a + Math.random() * (b - a);                          // a〜b の小数
const randInt = (a, b) => Math.round(rand(a, b));                            // a〜b の整数
const randStep = (a, b, step) => Math.round(Math.round(rand(a, b) / step) * step * 100) / 100;   // step刻み(0.05刻みなど)
const pick = (list) => list[Math.floor(Math.random() * list.length)];        // 配列からランダムに1つ
// 重みつき抽選: [[値, 重み], ...] から、重みに比例した確率で1つ選ぶ
function pickWeighted(pairs) {
  let r = Math.random() * pairs.reduce((sum, p) => sum + p[1], 0);
  for (const [value, weight] of pairs) { if ((r -= weight) < 0) return value; }
  return pairs[0][0];
}

// ===== ロック(鍵): ロックした項目は、シャッフルで変わらない =====
// 注意: ロックは「シャッフルによる自動変更」を止めるだけ。人がドロップダウンやスライダーを直接動かすのは、いつでもできる
const locks = { drawMode: false, colorMode: false, realityMix: false,
                grid: false, scale: false, edge: false, jitter: false, decay: false, afterimage: false, stutter: false };
const isLocked = (name) => locks[name];                                  // その項目はロックされているか?
const SLIDER_LOCKS = ['grid', 'scale', 'edge', 'jitter', 'decay', 'afterimage', 'stutter'];

// 鍵アイコン(SVG)。開いた鍵と閉じた鍵を両方入れておき、CSSの .locked で切り替える
const LOCK_SVG =
  '<svg class="i-open" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 0 1 5.8-1"/></svg>' +
  '<svg class="i-closed" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>';

const lockButtons = document.querySelectorAll('.lock');
const lockAllBtn = document.getElementById('lockAllSliders');

// ボタンの見た目を、いまのロック状態に合わせる
function renderLock(btn) {
  const on = locks[btn.dataset.lock];
  btn.classList.toggle('locked', on);
  btn.setAttribute('aria-pressed', String(on));
  btn.title = on ? 'ロック中: シャッフルで変わりません(クリックで解除)' : 'クリックでロック: シャッフルで変わらなくなります';
}
// 「全ロック / 全解除」の表示: スライダーが全部ロック中なら「全解除」
function syncLockAll() {
  lockAllBtn.textContent = SLIDER_LOCKS.every(k => locks[k]) ? '全解除' : '全ロック';
}
lockButtons.forEach(btn => {
  btn.innerHTML = LOCK_SVG;
  renderLock(btn);
  btn.addEventListener('click', () => {
    locks[btn.dataset.lock] = !locks[btn.dataset.lock];                  // ON/OFFを切り替える
    renderLock(btn);
    syncLockAll();
  });
});
lockAllBtn.addEventListener('click', () => {
  const lockThem = !SLIDER_LOCKS.every(k => locks[k]);                   // 全部ロック済みなら全解除、そうでなければ全ロック
  SLIDER_LOCKS.forEach(k => { locks[k] = lockThem; });
  lockButtons.forEach(renderLock);
  syncLockAll();
});
syncLockAll();

// ===== シャッフル本体(SHUFFLEボタン・Sキー・AUTO SHUFFLEから呼ばれる) =====
// ===== UNDO: シャッフルする直前の状態を保存しておき、1つずつ戻れるようにする =====
const historyStack = [];          // 保存した状態(新しいものが末尾)
const HISTORY_MAX = 20;           // 最大20件。超えたら古いものから捨てる
const undoBtn = document.getElementById('undoBtn');

// 今の状態をコピーして返す(描画モード・図形・カラー・実写ミックス・スライダー6本)
function snapshot() {
  return {
    drawMode: drawMode.value, shapeType: shapeType.value, colorMode: colorMode.value, mixMode: mixMode.value,
    params: { grid: params.grid, scale: params.scale, edge: params.edge, jitter: params.jitter, decay: params.decay, afterimage: params.afterimage, stutter: params.stutter },
    fx: { edge: fxEdge.checked, motion: fxMotion.checked, audio: audioReactive.checked },   // プリセットが切り替えるスイッチ類
  };
}
function pushHistory() {
  historyStack.push(snapshot());
  if (historyStack.length > HISTORY_MAX) historyStack.shift();   // 古いものを1つ捨てる
  undoBtn.disabled = false;                                      // 履歴ができたので、押せるようにする
}
function undoShuffle() {
  const snap = historyStack.pop();                               // 直前の状態を取り出す
  if (!snap) return;                                             // 履歴が空なら何もしない
  drawMode.value = snap.drawMode;                                // ドロップダウンの表示 + 内部の値
  shapeType.value = snap.shapeType;
  colorMode.value = snap.colorMode;
  mixMode.value = snap.mixMode;
  fxEdge.checked = snap.fx.edge; fxMotion.checked = snap.fx.motion; applyAudioReactive(snap.fx.audio);
  for (const key in snap.params) sliderSetters[key](snap.params[key]);   // つまみ・数値ラベル・内部の値(params)
  setActivePreset(null);           // どのプリセットの値かは分からないので、ハイライトは外す
  syncModeLegend(); syncMixHint(); paintRanges();
  needsRedraw = true;              // 停止中でも、すぐ描き直す
  undoBtn.disabled = historyStack.length === 0;                  // 履歴が空になったら、また半透明に戻す
}
undoBtn.addEventListener('click', undoShuffle);

function shuffleParameters() {
  // 変わる項目が1つでもあるときだけ、変更の「前」の状態を保存する(全部ロック中は何も変わらないので保存しない)
  if (!Object.values(locks).every(Boolean)) pushHistory();
  // --- モード系: ロックされていない項目だけ変える ---
  if (!isLocked('drawMode')) {
    // いまのモード以外から選ぶ(押したのに変化なし、をなくす)
    drawMode.value = pick(['shape', 'ascii', 'puzzle', 'emoji'].filter(m => m !== drawMode.value));
    shapeType.value = pick(['circle', 'square']);   // SHAPEの形は描画モードの一部として扱う(描画モードがロック中なら変えない)
  }
  // 実写ミックスが「実写あり」でロックされているとき、白黒マットを選ぶと設定が食い違うので、マットは選ばない
  const mixFixedOnReal = isLocked('realityMix') && mixMode.value !== 'convert';
  if (!isLocked('colorMode')) {
    // 白黒マット(背景が不透明な黒になる)は、透過素材を作りにくいので出にくくしている
    colorMode.value = pickWeighted(mixFixedOnReal ? [['original', 35], ['neon', 25], ['green', 20], ['mono', 20]]
                                                  : [['original', 30], ['neon', 25], ['green', 15], ['mono', 20], ['mask', 10]]);
  }
  if (!isLocked('realityMix')) {
    // 透過の「変換のみ」を約60%にする
    let mix = pickWeighted([['convert', 60], ['realBg', 20], ['convertBg', 20]]);
    if (colorMode.value === 'mask') mix = 'convert';                       // マットは変換のみで動くので、表示も合わせる
    if (!fxMotion.checked && mix === 'realBg') mix = 'convert';            // 動き検出がOFFだと、実写背景は何も重ならないので避ける
    mixMode.value = mix;
  }

  // --- スライダー: 画面が消えたり潰れたりしない、安全な範囲。ロックされていないものだけ ---
  const ranges = {
    grid:       () => randInt(10, 32),
    scale:      () => randStep(0.6, 1.2, 0.05),
    edge:       () => randStep(0.1, 0.8, 0.05),
    jitter:     () => randInt(0, 15),
    decay:      () => randInt(0, 65),      // 上限65%: 高すぎると画面が消えてしまう
    afterimage: () => randInt(0, 75),
    stutter:    () => randInt(0, 45),      // 上限45%: 高すぎると止まってばかりになる
  };
  let slidersChanged = false;
  for (const key in ranges) {
    if (isLocked(key)) continue;                                           // ロック中は触らない
    sliderSetters[key](ranges[key]());                                     // つまみ・数値ラベル・内部の値を、まとめて更新
    slidersChanged = true;
  }

  // --- 画面の表示を同期 ---
  // スライダーかモードが変わったので、プリセットのハイライトを外す(手動の状態に戻す)
  if (slidersChanged || !isLocked('drawMode') || !isLocked('colorMode') || !isLocked('realityMix')) setActivePreset(null);
  syncModeLegend();                // 「1 SHAPE / 2 ASCII …」の水色表示
  syncMixHint();                   // 実写ミックスの説明文
  paintRanges();                   // スライダーの水色の塗り
  needsRedraw = true;              // 停止中でも、すぐ描き直す

  if (Object.values(locks).every(Boolean)) statusEl.textContent = '全項目がロック中のため、シャッフルしても変わりません(鍵を外してください)';

  const btn = document.getElementById('shuffleBtn');   // ぴかっと光らせる
  btn.classList.add('flash');
  setTimeout(() => btn.classList.remove('flash'), 140);
}
document.getElementById('shuffleBtn').addEventListener('click', shuffleParameters);

// ===== AUTO SHUFFLE: 再生中だけ、一定間隔で自動シャッフル =====
const autoShuffle = document.getElementById('autoShuffle');
const autoInterval = document.getElementById('autoInterval');
let autoElapsed = 0;                  // 再生中に経過した時間(ミリ秒)
let autoLast = performance.now();
setInterval(() => {
  const now = performance.now(), dt = now - autoLast;
  autoLast = now;
  // OFFのとき、一時停止中、動画が未準備のときは、時間を進めない(=勝手に切り替わらない)
  if (!autoShuffle.checked || video.paused || video.readyState < 2) return;
  autoElapsed += dt;
  if (autoElapsed >= Number(autoInterval.value) * 1000) { autoElapsed = 0; shuffleParameters(); }
}, 100);
autoShuffle.addEventListener('change', () => { autoElapsed = 0; });   // ONにした瞬間から数え直す

// ===== DEMO映像: ファイルなしで試せる、内蔵のテスト映像 =====
// 仕組み: オフスクリーンのcanvas(demoCanvas)に、踊る人影と光の粒子をリアルタイムで描き、
//         そのcanvasの映像を captureStream() で <video> に流し込む。
//         → 再生・一時停止・時間・読み取りが、動画ファイルのときと「同じ <video>」を通るので、
//           解析(ソーベル・差分)・実写ミックス・録画・ショートカットは、そのまま同じように動く
const DEMO_W = 640, DEMO_H = 360;
const DEMO_REC_SECONDS = 12;                   // DEMOを録画するときは、この秒数で自動的に止める(動画ファイルの「最後まで」の代わり)
const demoCanvas = document.createElement('canvas');
demoCanvas.width = DEMO_W; demoCanvas.height = DEMO_H;
const dctx = demoCanvas.getContext('2d');
let demoActive = false, demoTime = 0, demoLast = 0, demoRaf = 0, demoStream = null, demoRecStart = null;

// 光の粒子: 最初に1回だけ作る。毎フレームのランダムは使わず、時間tから位置を計算する(なめらかに動く)
const demoParticles = (() => {
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  return Array.from({ length: 70 }, () => ({
    ax: 40 + rnd() * 240, ay: 30 + rnd() * 130, fx: 0.3 + rnd() * 1.1, fy: 0.3 + rnd() * 1.1,
    p: rnd() * 6.28, q: rnd() * 6.28, r: 1.5 + rnd() * 3.5, hue: [185, 320, 55, 270][Math.floor(rnd() * 4)],
  }));
})();

// (x, y)から、長さlen・角度angの先の点。angは 0=真下, π/2=真横, π=真上
const limbEnd = (x, y, len, ang) => [x + Math.sin(ang) * len, y + Math.cos(ang) * len];

// 時刻tのときの、人影の関節の位置を計算する(描くのは別の関数。cx=横の位置, hipY=腰の高さ, s=大きさ)
function figurePose(cx, hipY, s, t, phase) {
  const sw = (k, o = 0) => Math.sin(t * k + phase + o);
  const hip = [cx + sw(1.6) * 6 * s, hipY - Math.abs(sw(3.2)) * 7 * s];             // 足踏みで上下に弾む
  const lean = sw(2.0) * 0.14;                                                        // 上体が左右に傾く
  const shoulder = [hip[0] + Math.sin(lean) * 72 * s, hip[1] - Math.cos(lean) * 72 * s];
  const head = [shoulder[0] + Math.sin(lean) * 28 * s, shoulder[1] - Math.cos(lean) * 28 * s];
  const arms = [1, -1].map((side, i) => {                                             // 左右の腕: 下げたり、上に振り上げたり
    const a = side * (0.5 + 1.2 * (sw(2.4, i * 2.1) + 1));
    const elbow = limbEnd(shoulder[0], shoulder[1], 44 * s, a);
    const hand = limbEnd(elbow[0], elbow[1], 40 * s, a + side * 0.8 * sw(4.1, i));   // 肘の曲げ
    return [shoulder, elbow, hand];
  });
  const step = sw(3.2);
  const legs = [1, -1].map((side) => {                                                // 左右の脚: 交互に足踏み
    const ph = side * step;
    const thigh = side * 0.14 + ph * 0.55;
    const knee = limbEnd(hip[0], hip[1], 52 * s, thigh);
    const foot = limbEnd(knee[0], knee[1], 52 * s, thigh - Math.max(0, -ph) * 0.9);  // 後ろに振るとき膝を曲げる
    return [hip, knee, foot];
  });
  return { hip, shoulder, head, arms, legs };
}

// 関節の位置をつないで、太い線と丸でシルエットを描く
function drawFigure(c, pose, s, color) {
  c.save();
  c.strokeStyle = color; c.fillStyle = color; c.lineCap = 'round'; c.lineJoin = 'round';
  c.shadowColor = 'rgba(0, 212, 255, 0.6)'; c.shadowBlur = 16 * s;                     // ほんのり水色の光
  c.lineWidth = 30 * s;                                                                // 胴体
  c.beginPath(); c.moveTo(pose.hip[0], pose.hip[1]); c.lineTo(pose.shoulder[0], pose.shoulder[1]); c.stroke();
  c.beginPath(); c.arc(pose.head[0], pose.head[1], 16 * s, 0, Math.PI * 2); c.fill();  // 頭
  c.lineWidth = 13 * s;                                                                // 腕と脚
  for (const limb of [...pose.arms, ...pose.legs]) {
    c.beginPath(); c.moveTo(limb[0][0], limb[0][1]); c.lineTo(limb[1][0], limb[1][1]); c.lineTo(limb[2][0], limb[2][1]); c.stroke();
  }
  c.restore();
}

// デモ映像の1コマを描く(tは経過秒)
function drawDemo(t) {
  const c = dctx;
  c.globalCompositeOperation = 'source-over';
  const g = c.createLinearGradient(0, 0, 0, DEMO_H);                                   // 暗い紫のグラデーション背景
  g.addColorStop(0, '#0d0b1f'); g.addColorStop(1, '#241040');
  c.fillStyle = g; c.fillRect(0, 0, DEMO_W, DEMO_H);

  c.globalCompositeOperation = 'lighter';                                              // 光の筋(ゆっくり揺れるだけ = ほぼ静止した背景)
  const beams = ['rgba(0,212,255,0.07)', 'rgba(255,43,214,0.07)', 'rgba(255,220,120,0.05)'];
  beams.forEach((color, i) => {
    const bx = DEMO_W * (0.2 + 0.3 * i) + Math.sin(t * 0.25 + i * 2) * 60, drift = (i - 1) * 60;
    c.fillStyle = color;
    c.beginPath(); c.moveTo(bx - 8, 0); c.lineTo(bx + 8, 0); c.lineTo(bx + 90 + drift, DEMO_H); c.lineTo(bx - 90 + drift, DEMO_H); c.closePath(); c.fill();
  });
  c.globalCompositeOperation = 'source-over';

  const far = figurePose(DEMO_W / 2 - 170 * Math.sin(t * 0.45 + 1), 238, 0.7, t, 1.9);   // 奥の小さな人(暗め)
  drawFigure(c, far, 0.7, 'rgba(150, 130, 255, 0.85)');
  const near = figurePose(DEMO_W / 2 + 150 * Math.sin(t * 0.45), 215, 1, t, 0);          // 手前の人(明るい。左右に歩きながら踊る)
  drawFigure(c, near, 1, '#fff6ea');

  c.globalCompositeOperation = 'lighter';                                              // 光の粒子(画面を飛び回る)
  for (const q of demoParticles) {
    const x = DEMO_W / 2 + q.ax * Math.sin(t * q.fx + q.p), y = DEMO_H / 2 + q.ay * Math.cos(t * q.fy + q.q);
    c.fillStyle = `hsla(${q.hue}, 100%, 65%, 0.16)`; c.beginPath(); c.arc(x, y, q.r * 3, 0, Math.PI * 2); c.fill();   // にじみ
    c.fillStyle = `hsla(${q.hue}, 100%, 75%, 0.95)`; c.beginPath(); c.arc(x, y, q.r, 0, Math.PI * 2); c.fill();       // 芯
  }
  c.globalCompositeOperation = 'source-over';
}

// デモのアニメーションを進め続ける
function demoLoop(now) {
  if (!demoActive) return;
  demoRaf = requestAnimationFrame(demoLoop);
  const dt = Math.min(100, now - demoLast);
  demoLast = now;
  if (!video.paused) demoTime += dt / 1000;      // 一時停止中は、デモの時間も止める(動画ファイルと同じ)
  drawDemo(demoTime);
  // 録画中は、DEMO_REC_SECONDS秒たったら自動で止める
  if (demoRecStart !== null) {
    if (!(recorder && recorder.state === 'recording')) demoRecStart = null;
    else if (demoTime - demoRecStart >= DEMO_REC_SECONDS) { demoRecStart = null; stopRecording(); }
  }
}

function startDemo() {
  if (!demoCanvas.captureStream) {
    showNotice('このブラウザは、内蔵のDEMO映像に対応していません。Chromeでお試しください。', '');
    return;
  }
  stopDemo();                                                 // すでにDEMO中なら、いったん終了して最初から
  hideNotice();
  loadFailed = false;
  currentFile = null;
  document.getElementById('fileInput').value = '';           // 同じファイルをあとで選び直しても反応するように空にする
  demoActive = true; demoTime = 0; demoLast = performance.now(); demoRecStart = null;
  recBtn.disabled = true;                                     // 映像が届くまで、録画・再生は無効(届くと loadedmetadata で有効になる)
  document.getElementById('playBtn').disabled = true;
  prevFrameData = null;
  resetTrail();
  drawDemo(0);                                                // 最初の1コマを先に描いてから、ストリームにする
  demoStream = demoCanvas.captureStream(30);                 // canvasの映像 → 30fpsのストリーム
  video.srcObject = demoStream;                              // 動画ファイルの代わりに、これを再生する
  video.play().catch(() => {});
  document.getElementById('fileName').textContent = 'DEMO映像（内蔵）';
  statusEl.textContent = 'DEMO映像を準備中...';
  demoRaf = requestAnimationFrame(demoLoop);
}

// DEMOを終了する(動画ファイルを選んだとき、もう一度DEMOを押したときに呼ばれる)
function stopDemo() {
  if (!demoActive) return;
  demoActive = false;
  cancelAnimationFrame(demoRaf);
  if (demoStream) { demoStream.getTracks().forEach(t => t.stop()); demoStream = null; }
  video.pause();
  video.srcObject = null;                                     // これを外さないと、あとで選んだ動画ファイルが再生されない
  demoRecStart = null;
}

document.getElementById('demoBtn').addEventListener('click', startDemo);
video.addEventListener('loadedmetadata', () => {
  if (demoActive) statusEl.textContent = 'DEMO映像（内蔵）  Spaceで一時停止 / 再生';
});
// DEMOの録画は、デモの時間を0に戻して、頭から録画する(動画ファイルの「頭出し」の代わり)
recBtn.addEventListener('click', () => {
  if (demoActive && recorder && recorder.state === 'recording') { demoTime = 0; demoRecStart = 0; resetTrail(); }
});

// 一時停止や再生位置のジャンプのときは、フリーズを解除する
video.addEventListener('pause', () => { freezeCountdown = 0; });
video.addEventListener('seeked', () => { freezeCountdown = 0; });

// ===== AUDIO REACTIVE: 低音(キック・ベース)に合わせて、JitterとDecayを一時的に跳ね上げる =====
// 流れ: <video>の音 → AnalyserNode(周波数を測る) → GainNode(音量) → スピーカー
//       測った低音の強さ(bassLevel)を、描画のときだけ Jitter / Decay に足す。スライダーの位置と値(params)は書き換えない
const audioReactive = document.getElementById('audioReactive');
const soundOn = document.getElementById('soundOn');
const meterEl = document.getElementById('audioMeter');
const audioHint = document.getElementById('audioHint');
let isAudioInitialized = false;      // 初期化したか。createMediaElementSource は、同じ<video>に一生に1回しか呼べないので、二重に作らない旗
let audioCtx = null, analyser = null, outGain = null, freqData = null, audioDest = null;
let audioFailed = false;             // 音声の初期化に失敗した(その場合は「音量0」として動き続ける)
let userVolume = 1;                  // 動画プレーヤー側で調整された音量(出力のGainに反映する)
let audioSensitivity = 1.5;          // Beat Sensitivity
let bassLevel = 0;                   // 低音の強さ 0.0〜1.0
let effectiveJitter = 0, effectiveDecay = 0;   // 描画に実際に使う値(スライダーの値 + 音のブースト)
let silentFrames = 0;

// 初回の再生時に、1回だけ呼ばれる
function initAudio() {
  if (isAudioInitialized) return;
  isAudioInitialized = true;         // 失敗しても、もう一度作り直さない
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { audioFailed = true; return; }
  try {
    audioCtx = new AC();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;                       // 周波数の分解能。binの幅は サンプルレート÷512 (約94Hz)
    analyser.smoothingTimeConstant = 0.5;         // 小さいほど、ビートの立ち上がりが速い
    const source = audioCtx.createMediaElementSource(video);
    outGain = audioCtx.createGain();              // スピーカーへの音量(「音声を出す」スイッチ用)
    source.connect(analyser);
    analyser.connect(outGain);
    outGain.connect(audioCtx.destination);        // これを繋がないと、動画の音がスピーカーから出なくなる
    audioDest = audioCtx.createMediaStreamDestination();   // 録画用の出口。「音声を出す」がOFFでも、AUDIO REACTIVEがOFFでも、音はここへ流れる
    analyser.connect(audioDest);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    video.muted = false;                          // 動画自身がミュートだと、解析にも無音が届くため、ミュートは外す
    video.volume = 1;                             // 聞こえる大きさは、outGain側で調整する
    applyOutputGain();
  } catch (err) {
    console.warn('音声解析を開始できませんでした(音量0として動きます):', err);
    audioFailed = true;
  }
}
function applyOutputGain() { if (outGain) outGain.gain.value = soundOn.checked ? userVolume : 0; }

// ブラウザの自動再生ルール: 一時停止(suspended)のままだと音が出ないので、再生・操作のたびに再開させる
function resumeAudio() { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {}); }
// 録画に入れる音声トラックを返す。音がない場合(DEMO・無音の動画・音声を使えない環境)は、空の配列
function getRecordingAudioTracks() {
  if (demoActive) return [];                        // DEMOには音声がない
  initAudio();                                      // 再生前にRECを押した場合でも、ここで初期化する(1回だけ)
  resumeAudio();                                    // 一時停止(suspended)のままだと、無音が録画される
  if (!audioDest) return [];
  video.muted = false;                              // 動画自身がミュートだと、無音が届く
  const noAudio = video.mozHasAudio === false
    || (video.audioTracks && video.audioTracks.length === 0)
    || (video.webkitAudioDecodedByteCount === 0 && video.currentTime > 0.5);   // 0.5秒以上再生したのに、音のデータが0 = 無音の動画
  return noAudio ? [] : audioDest.stream.getAudioTracks();
}
video.addEventListener('play', () => { initAudio(); resumeAudio(); });
window.addEventListener('pointerdown', resumeAudio, { passive: true });
window.addEventListener('keydown', resumeAudio, { passive: true });

// 低音の強さ(0〜1)を、毎フレーム測る
function computeBass() {
  let raw = 0;                                    // 音声がない・DEMO・解析できないときは 0(=音量0として安全に動く)
  try {
    if (isAudioInitialized && analyser && audioCtx.state === 'running' && !video.paused) {
      analyser.getByteFrequencyData(freqData);    // 周波数ごとの強さ(0〜255)。先頭ほど低音
      const binHz = audioCtx.sampleRate / analyser.fftSize;
      const end = Math.max(2, Math.min(freqData.length - 1, Math.round(250 / binHz)));   // およそ0〜250Hz(キック・ベース)まで
      let sum = 0;
      for (let i = 0; i <= end; i++) sum += freqData[i];
      raw = sum / (end + 1) / 255;                // 平均を0.0〜1.0にする
    }
  } catch (err) { raw = 0; }
  // 立ち上がりは即座に、下がるときはゆっくり(ビートの余韻)
  bassLevel = raw > bassLevel ? raw : bassLevel * 0.88;
  if (bassLevel < 0.005) bassLevel = 0;
}

// 描画に使う値を計算する。音連動がOFFなら、スライダーの値そのまま
function updateEffective() {
  const boost = audioReactive.checked ? bassLevel * audioSensitivity : 0;
  effectiveJitter = params.jitter + boost * 25;
  // Decayは上限85%(画面が完全に消えないように)。ただし、スライダー自身の値より下がることはない
  effectiveDecay = audioReactive.checked ? Math.max(params.decay, Math.min(85, params.decay + boost * 50)) : params.decay;
}

// レベルメーターと、状態の説明
function audioHintText() {
  if (audioFailed) return '音声解析を開始できませんでした。音量0として動作します。';
  if (demoActive) return 'DEMO映像には音声がないため、音量0として動作します。';
  if (!isAudioInitialized) return '動画を再生すると、低音の解析を始めます。';
  if (audioCtx && audioCtx.state === 'suspended') return '画面をクリックすると、音の解析を始めます。';
  if (silentFrames > 150) return '音が検出されていません（無音の動画、または音声トラックなし）。';
  return audioReactive.checked ? '低音に合わせて、Jitter と Decay が跳ね上がります。' : '音連動はOFFです（メーターは測定中）。';
}
let meterShown = -1, hintTick = 0;
function audioTick() {
  requestAnimationFrame(audioTick);
  computeBass();
  const pct = Math.round(bassLevel * 100);
  if (pct !== meterShown) { meterEl.style.width = pct + '%'; meterShown = pct; }
  silentFrames = (!video.paused && bassLevel < 0.01) ? silentFrames + 1 : 0;
  if (++hintTick % 15 === 0) audioHint.textContent = audioHintText();
}
requestAnimationFrame(audioTick);

// --- UI ---
// Beat Sensitivity: プリセットやシャッフルの対象外なので、専用の処理にしている(プリセットのハイライトも外さない)
const sensSlider = document.getElementById('audioSensSlider');
const sensOut = document.getElementById('audioSensOut');
const updateSens = () => { audioSensitivity = Number(sensSlider.value); sensOut.textContent = audioSensitivity.toFixed(1); };
sensSlider.addEventListener('input', updateSens);
updateSens();
// 音連動のON/OFFを、スイッチとメーターの表示にまとめて反映する(プリセット・UNDOからも使う)
function applyAudioReactive(on) { audioReactive.checked = on; meterEl.parentElement.classList.toggle('off', !on); }
audioReactive.addEventListener('change', () => applyAudioReactive(audioReactive.checked));
soundOn.addEventListener('change', () => { if (soundOn.checked && userVolume === 0) userVolume = 1; applyOutputGain(); });

// 動画プレーヤー(左上の元動画)のミュートや音量の操作: そのままだと解析にも無音が届くので、
// 動画自身は常に「ミュートなし・音量最大」に戻し、操作内容は出力の音量(Gain)と「音声を出す」スイッチに反映する
video.addEventListener('volumechange', () => {
  if (!isAudioInitialized || (!video.muted && video.volume === 1)) return;
  const v = video.muted ? 0 : video.volume;
  video.muted = false; video.volume = 1;
  userVolume = v;
  soundOn.checked = v > 0;
  applyOutputGain();
});

// ===== サイドバーの幅をドラッグで変える(リサイズハンドル) =====
// 流れ: ハンドルを押す(isResizing=true) → マウスを動かす間、サイドバーの幅を更新 → 離す(isResizing=false)
// マウスだけでなくタッチペン・指でも動くよう、pointerイベント(マウスのイベントの上位版)を使っている
const sidebarEl = document.querySelector('.sidebar');
const resizer = document.getElementById('resizer');
const SIDEBAR_MIN = 280;            // 最小幅(px)
const SIDEBAR_DEFAULT = 390;        // 標準の幅(ダブルクリックで戻る)
const SIDEBAR_MAX_RATIO = 0.6;      // 最大幅 = 画面幅の60%
let isResizing = false;

// 幅を、最小〜最大の範囲に収めて(クランプ)、サイドバーに反映する
function setSidebarWidth(px) {
  const max = Math.max(SIDEBAR_MIN, window.innerWidth * SIDEBAR_MAX_RATIO);
  const width = Math.min(max, Math.max(SIDEBAR_MIN, px));
  sidebarEl.style.width = `${width}px`;
  return width;
}

function startResize(e) {
  if (e.button !== undefined && e.button !== 0) return;     // 左クリックだけ
  isResizing = true;
  resizer.setPointerCapture(e.pointerId);                    // ハンドルから外れても、動きを受け取り続ける
  resizer.classList.add('dragging');                         // ドラッグ中は光らせる
  document.body.style.userSelect = 'none';                   // ドラッグ中に文字が選択されて青くなるのを防ぐ
  document.body.style.cursor = 'col-resize';                 // ハンドルから外れても、カーソルは左右矢印のまま
  e.preventDefault();
}
function doResize(e) {
  if (!isResizing) return;
  // マウスのX座標 - サイドバーの左端 = サイドバーの新しい幅
  setSidebarWidth(e.clientX - sidebarEl.getBoundingClientRect().left);
}
function endResize(e) {
  if (!isResizing) return;
  isResizing = false;
  if (e && resizer.hasPointerCapture && resizer.hasPointerCapture(e.pointerId)) resizer.releasePointerCapture(e.pointerId);
  resizer.classList.remove('dragging');
  document.body.style.userSelect = '';                       // 元に戻す
  document.body.style.cursor = '';
}
resizer.addEventListener('pointerdown', startResize);
document.addEventListener('pointermove', doResize);
document.addEventListener('pointerup', endResize);
document.addEventListener('pointercancel', endResize);
resizer.addEventListener('dblclick', () => { setSidebarWidth(SIDEBAR_DEFAULT); });   // ダブルクリックで標準幅に戻す

// キーボードでも調整できる(ハンドルにフォーカスして ← → : 16px、Shift: 48px、Home / Enter: 標準幅)
resizer.addEventListener('keydown', (e) => {
  const now = sidebarEl.getBoundingClientRect().width, step = e.shiftKey ? 48 : 16;
  if (e.code === 'ArrowLeft') setSidebarWidth(now - step);
  else if (e.code === 'ArrowRight') setSidebarWidth(now + step);
  else if (e.code === 'Home' || e.code === 'Enter') setSidebarWidth(SIDEBAR_DEFAULT);
  else return;
  e.preventDefault();
});
</script>
</body>
</html>
